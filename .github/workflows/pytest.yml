# .github/workflows/app.yaml
name: PyTest
on: push

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # Setup Python (faster than using Python container)
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel

      - name: Build
        run: make build

      - name: Install wheel
        run: pip install $(echo dist/*.whl)"[test]"

      - name: Run tests
        run: |
          make test-with-coverage
          coverage report --format=markdown >"${GITHUB_STEP_SUMMARY}"

      - name: Check out quickstarters repository
        uses: actions/checkout@v7
        with:
          repository: crunchdao/competitions
          path: competitions

      - name: Run convert tests
        env:
          CLONED_COMPETITIONS_REPOSITORY_PATH: competitions
        run: python -m pytest -v tests/notebook/test_quickstarters.py
